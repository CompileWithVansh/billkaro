<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <title>BillKaro POS</title>
    <script>
      (function() {
        var isStandalone = ('standalone' in window.navigator && window.navigator.standalone) ||
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches;
        if (isStandalone) {
          document.documentElement.classList.add('is-standalone-pwa');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration failed:', err);
          });
        });

        // Automatically reload when a new service worker version activates
        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        // Check for updates whenever user returns to the app from the background
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) reg.update();
            });
          }
        });
      }
    </script>
  </body>
</html>
